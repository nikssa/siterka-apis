<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #34495e; }
      .text { font-family: Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .small-text { font-family: Arial, sans-serif; font-size: 10px; fill: #7f8c8d; }
      .hook-text { font-family: Arial, sans-serif; font-size: 11px; fill: #2980b9; font-weight: bold; }
      .context-live { fill: #e8f5e8; stroke: #27ae60; stroke-width: 2; }
      .context-draft { fill: #fff3cd; stroke: #f39c12; stroke-width: 2; }
      .react-query { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2; }
      .component { fill: #f8f9fa; stroke: #6c757d; stroke-width: 2; }
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .data-flow { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); stroke-dasharray: 5,5; }
      .user-action { stroke: #9b59b6; stroke-width: 2; fill: none; marker-end: url(#arrowhead-purple); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b59b6" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" class="title">React App Architecture: Two-Instance Context Pattern</text>
  
  <!-- React Query Layer -->
  <g>
    <rect x="50" y="60" width="300" height="120" class="react-query" rx="8"/>
    <text x="200" y="85" text-anchor="middle" class="subtitle">React Query Layer</text>
    <text x="200" y="105" text-anchor="middle" class="small-text">Server State Management</text>
    
    <!-- React Query Hooks -->
    <rect x="70" y="120" width="80" height="25" class="component" rx="4"/>
    <text x="110" y="136" text-anchor="middle" class="hook-text">useOrganizations()</text>
    
    <rect x="160" y="120" width="60" height="25" class="component" rx="4"/>
    <text x="190" y="136" text-anchor="middle" class="hook-text">useEvents()</text>
    
    <rect x="230" y="120" width="70" height="25" class="component" rx="4"/>
    <text x="265" y="136" text-anchor="middle" class="hook-text">useCountries()</text>
    
    <rect x="70" y="150" width="70" height="25" class="component" rx="4"/>
    <text x="105" y="166" text-anchor="middle" class="hook-text">useDateRange()</text>
  </g>
  
  <!-- Live Context -->
  <g>
    <rect x="450" y="60" width="280" height="140" class="context-live" rx="8"/>
    <text x="590" y="85" text-anchor="middle" class="subtitle">Live Context (Main App)</text>
    <text x="590" y="105" text-anchor="middle" class="small-text">EventContext.Provider - Active Filter State</text>
    
    <!-- Filter State Box -->
    <rect x="470" y="120" width="240" height="65" class="component" rx="4"/>
    <text x="590" y="138" text-anchor="middle" class="text">Filter State:</text>
    <text x="590" y="155" text-anchor="middle" class="small-text">• searchQuery: string</text>
    <text x="590" y="168" text-anchor="middle" class="small-text">• selectedOrganizations: string[]</text>
    <text x="590" y="181" text-anchor="middle" class="small-text">• dateRange: DateRange</text>
  </g>
  
  <!-- Main Application Components -->
  <g>
    <rect x="450" y="230" width="280" height="100" class="component" rx="8"/>
    <text x="590" y="255" text-anchor="middle" class="subtitle">Main Application</text>
    
    <rect x="470" y="270" width="100" height="40" class="component" rx="4"/>
    <text x="520" y="285" text-anchor="middle" class="text">EventList</text>
    <text x="520" y="300" text-anchor="middle" class="small-text">Component</text>
    
    <rect x="590" y="270" width="100" height="40" class="component" rx="4"/>
    <text x="640" y="285" text-anchor="middle" class="text">Filter UI</text>
    <text x="640" y="300" text-anchor="middle" class="small-text">Components</text>
  </g>
  
  <!-- Draft Context (Drawer) -->
  <g>
    <rect x="800" y="60" width="320" height="200" class="context-draft" rx="8"/>
    <text x="960" y="85" text-anchor="middle" class="subtitle">Draft Context (Filter Drawer)</text>
    <text x="960" y="105" text-anchor="middle" class="small-text">EventContext.Provider - Temporary State</text>
    
    <!-- Draft Filter State -->
    <rect x="820" y="120" width="280" height="65" class="component" rx="4"/>
    <text x="960" y="138" text-anchor="middle" class="text">Draft Filter State (Copy):</text>
    <text x="960" y="155" text-anchor="middle" class="small-text">• searchQuery: string (editing)</text>
    <text x="960" y="168" text-anchor="middle" class="small-text">• selectedOrganizations: string[] (editing)</text>
    <text x="960" y="181" text-anchor="middle" class="small-text">• dateRange: DateRange (editing)</text>
    
    <!-- Drawer Components -->
    <rect x="820" y="200" width="120" height="40" class="component" rx="4"/>
    <text x="880" y="215" text-anchor="middle" class="text">Search Input</text>
    <text x="880" y="230" text-anchor="middle" class="small-text">Component</text>
    
    <rect x="960" y="200" width="120" height="40" class="component" rx="4"/>
    <text x="1020" y="215" text-anchor="middle" class="text">Filter Controls</text>
    <text x="1020" y="230" text-anchor="middle" class="small-text">Components</text>
  </g>
  
  <!-- Custom Hooks Bridge -->
  <g>
    <rect x="150" y="230" width="200" height="60" class="component" rx="8"/>
    <text x="250" y="255" text-anchor="middle" class="subtitle">Custom Hooks Bridge</text>
    <text x="250" y="275" text-anchor="middle" class="small-text">Abstract data-fetching logic</text>
  </g>
  
  <!-- Workflow Steps -->
  <g>
    <text x="50" y="380" class="subtitle">Workflow: Two-Instance Context Pattern</text>
    
    <!-- Step 1 -->
    <circle cx="70" cy="410" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="70" y="416" text-anchor="middle" class="text" fill="white">1</text>
    <text x="100" y="416" class="text">Initial Load: Live Context provides filter state to EventList</text>
    
    <!-- Step 2 -->
    <circle cx="70" cy="440" r="15" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
    <text x="70" y="446" text-anchor="middle" class="text" fill="white">2</text>
    <text x="100" y="446" class="text">User opens drawer: Draft Context created with copy of Live state</text>
    
    <!-- Step 3 -->
    <circle cx="70" cy="470" r="15" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
    <text x="70" y="476" text-anchor="middle" class="text" fill="white">3</text>
    <text x="100" y="476" class="text">User edits filters: Draft Context updated, Live Context unchanged</text>
    
    <!-- Step 4 -->
    <circle cx="70" cy="500" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="70" y="506" text-anchor="middle" class="text" fill="white">4</text>
    <text x="100" y="506" class="text">Apply Filters: Draft state copied to Live Context, drawer closes</text>
    
    <!-- Step 5 -->
    <circle cx="70" cy="530" r="15" fill="#27ae60" stroke="#229954" stroke-width="2"/>
    <text x="70" y="536" text-anchor="middle" class="text" fill="white">5</text>
    <text x="100" y="536" class="text">Re-render: React Query refetches, EventList updates with new data</text>
  </g>
  
  <!-- Data Flow Arrows -->
  <!-- React Query to Custom Hooks -->
  <path d="M 200 180 L 250 230" class="arrow"/>
  
  <!-- Custom Hooks to Live Context -->
  <path d="M 350 260 L 450 200" class="arrow"/>
  
  <!-- Live Context to Main Components -->
  <path d="M 590 200 L 590 230" class="arrow"/>
  
  <!-- Live Context to Draft Context (copy) -->
  <path d="M 730 130 L 800 130" class="user-action"/>
  <text x="765" y="120" text-anchor="middle" class="small-text">Copy state</text>
  
  <!-- Draft Context back to Live Context (apply) -->
  <path d="M 820 150 L 750 150" class="data-flow"/>
  <text x="785" y="140" text-anchor="middle" class="small-text">Apply filters</text>
  
  <!-- Query triggers from Live Context -->
  <path d="M 450 130 L 350 130" class="data-flow"/>
  <text x="400" y="120" text-anchor="middle" class="small-text">Filter criteria</text>
  
  <!-- Benefits Box -->
  <g>
    <rect x="50" y="580" width="500" height="120" class="component" rx="8"/>
    <text x="300" y="605" text-anchor="middle" class="subtitle">Key Benefits</text>
    
    <text x="70" y="630" class="text">✓ Performance: Main UI doesn't re-render during filter editing</text>
    <text x="70" y="650" class="text">✓ User Experience: Smooth interactions, explicit apply action</text>
    <text x="70" y="670" class="text">✓ Separation of Concerns: Clear distinction between live and draft state</text>
    <text x="70" y="690" class="text">✓ Scalability: Easy to add new filters without affecting performance</text>
  </g>
  
  <!-- Technology Stack -->
  <g>
    <rect x="600" y="580" width="500" height="120" class="component" rx="8"/>
    <text x="850" y="605" text-anchor="middle" class="subtitle">Technology Stack</text>
    
    <text x="620" y="630" class="text">• React Query: Server state management and caching</text>
    <text x="620" y="650" class="text">• React Context: Client state management for filters</text>
    <text x="620" y="670" class="text">• Custom Hooks: Abstraction layer for data fetching</text>
    <text x="620" y="690" class="text">• Two-Instance Pattern: Performance optimization</text>
  </g>
  
  <!-- Legend -->
  <g>
    <text x="50" y="750" class="subtitle">Legend</text>
    
    <rect x="50" y="760" width="20" height="15" class="react-query"/>
    <text x="80" y="772" class="small-text">React Query Layer</text>
    
    <rect x="200" y="760" width="20" height="15" class="context-live"/>
    <text x="230" y="772" class="small-text">Live Context</text>
    
    <rect x="330" y="760" width="20" height="15" class="context-draft"/>
    <text x="360" y="772" class="small-text">Draft Context</text>
    
    <rect x="460" y="760" width="20" height="15" class="component"/>
    <text x="490" y="772" class="small-text">Components</text>
    
    <line x1="50" y1="790" x2="70" y2="790" class="arrow"/>
    <text x="80" y="795" class="small-text">Data Flow</text>
    
    <line x1="150" y1="790" x2="170" y2="790" class="data-flow"/>
    <text x="180" y="795" class="small-text">Filter Updates</text>
    
    <line x1="280" y1="790" x2="300" y2="790" class="user-action"/>
    <text x="310" y="795" class="small-text">User Actions</text>
  </g>
</svg>